<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ResumeIQ — Know how your resume performs before you apply</title>
    <meta
      name="description"
      content="Analyse your resume against a real job description and see your ATS score, match score, skill gaps and exactly what to improve."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applied before first paint so the page never flashes the wrong theme, which is
      // the whole reason the preference lives in localStorage rather than in React state.
      //
      // Three stored values are possible — 'system', 'light', 'dark' — and only the last
      // two are decisions. Anything else, including a value written by an older build,
      // falls back to the operating system rather than silently meaning "light".
      (function () {
        try {
          var stored = window.localStorage.getItem('resumeiq.theme')
          var chosen = stored === 'dark' || stored === 'light'
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', chosen ? stored === 'dark' : prefersDark)
        } catch (error) {
          // Storage can be blocked. Falling back to the light theme is fine.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
