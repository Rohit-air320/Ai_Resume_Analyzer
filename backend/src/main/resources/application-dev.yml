# ===========================================================================
#  Profile: dev  (default)
#  H2 in memory, running in MySQL compatibility mode so the same JPA mappings
#  and SQL semantics apply as in production. Nothing to install.
#  Data resets on every restart, which is what you want while iterating.
# ===========================================================================
spring:
  datasource:
    url: jdbc:h2:mem:resumeiq;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.resumeiq: DEBUG
