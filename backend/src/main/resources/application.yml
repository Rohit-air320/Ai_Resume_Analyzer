# ===========================================================================
#  ResumeIQ API — shared configuration
#  Profile-specific datasource settings live in application-{profile}.yml
#  Default profile is "dev" (H2 in memory), so `mvn spring-boot:run` works
#  with no database installed.
# ===========================================================================
spring:
  application:
    name: ResumeIQ API
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:8MB}
  jackson:
    # Omit null fields so error payloads stay small and predictable
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # One analysis writes ~30 skill rows plus its recommendations in a single
          # flush; batching turns that from 40 round trips into two.
          batch_size: 30
        order_inserts: true
        order_updates: true

server:
  port: ${SERVER_PORT:8080}
  # "none" by default, which is the safe default: getRemoteAddr reports the socket that
  # actually connected. Set to "framework" only when this API sits behind a proxy that
  # sets X-Forwarded-* and strips anything a client sent — otherwise a caller could
  # forge the address the login throttle counts against and rotate past the lockout.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    # Never leak internals to the browser (spec section 32)
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  compression:
    enabled: true

resumeiq:
  app:
    name: ResumeIQ
    version: 0.1.0
  cors:
    # Comma-separated browser origins allowed to call this API
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    # Load the skill taxonomy (backend/src/main/resources/data/skills.json) on startup.
    # Idempotent: existing rows are left alone, new skills and aliases are added.
    skills: ${SEED_SKILLS:true}
  auth:
    # HMAC key for access tokens. Left empty on purpose: this repository ships no
    # default secret. In the dev profile a blank value makes the API mint a random
    # key at startup (so tokens simply stop working after a restart); in any other
    # profile a blank value stops the application from starting.
    jwt-secret: ${JWT_SECRET:}
    # Short-lived because the browser keeps it in memory and refreshes silently.
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    # Rotated on every use, so this bounds inactivity, not the life of one token.
    refresh-token-days: ${REFRESH_TOKEN_DAYS:7}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:resumeiq_rt}
    # Lax is the CSRF defence for /api/auth/refresh: a cross-site POST carries no cookie.
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    # http://localhost is not a secure context, so this must be true only once deployed.
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.resumeiq: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
