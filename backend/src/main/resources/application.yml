# ===========================================================================
#  ResumeIQ API — shared configuration
#  Profile-specific datasource settings live in application-{profile}.yml
#  Default profile is "dev" (H2 in memory), so `mvn spring-boot:run` works
#  with no database installed.
# ===========================================================================
spring:
  application:
    name: ResumeIQ API
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:8MB}
  jackson:
    # Omit null fields so error payloads stay small and predictable
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # One analysis writes ~30 skill rows plus its recommendations in a single
          # flush; batching turns that from 40 round trips into two.
          batch_size: 30
        order_inserts: true
        order_updates: true

server:
  port: ${SERVER_PORT:8080}
  # "none" by default, which is the safe default: getRemoteAddr reports the socket that
  # actually connected. Set to "framework" only when this API sits behind a proxy that
  # sets X-Forwarded-* and strips anything a client sent — otherwise a caller could
  # forge the address the login throttle counts against and rotate past the lockout.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    # Never leak internals to the browser (spec section 32)
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  compression:
    enabled: true

resumeiq:
  app:
    name: ResumeIQ
    version: 0.1.0
  cors:
    # Comma-separated browser origins allowed to call this API
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    # Load the skill taxonomy (backend/src/main/resources/data/skills.json) on startup.
    # Idempotent: existing rows are left alone, new skills and aliases are added.
    skills: ${SEED_SKILLS:true}
  auth:
    # HMAC key for access tokens. Left empty on purpose: this repository ships no
    # default secret. In the dev profile a blank value makes the API mint a random
    # key at startup (so tokens simply stop working after a restart); in any other
    # profile a blank value stops the application from starting.
    jwt-secret: ${JWT_SECRET:}
    # Short-lived because the browser keeps it in memory and refreshes silently.
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    # Rotated on every use, so this bounds inactivity, not the life of one token.
    refresh-token-days: ${REFRESH_TOKEN_DAYS:7}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:resumeiq_rt}
    # Lax is the CSRF defence for /api/auth/refresh: a cross-site POST carries no cookie.
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    # http://localhost is not a secure context, so this must be true only once deployed.
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
  upload:
    # Where resume files land. Server-generated names only — nothing an uploader
    # types ever becomes part of a path. Keep this off the classpath and out of any
    # directory the web server can serve directly.
    storage-dir: ${RESUME_STORAGE_DIR:./storage/resumes}
    # Same variable as spring.servlet.multipart.max-file-size above, so the container
    # limit and the service limit are one decision instead of two that can disagree.
    max-file-size: ${MAX_UPLOAD_SIZE:5MB}
    # Below this many characters the file parsed but said nothing — almost always a
    # scan or an image-only export. Rejected with an explanation, not silently scored.
    min-extracted-characters: ${MIN_RESUME_CHARACTERS:200}
    # A two-page resume is ~4,000 characters. This is generous and still bounded.
    max-extracted-characters: ${MAX_RESUME_CHARACTERS:40000}
    max-resumes-per-user: ${MAX_RESUMES_PER_USER:25}
  posting:
    # A job description is pasted, not uploaded, so the only real limit is length.
    # Below this, someone copied the job title and lost the body; scoring a resume
    # against three lines produces a confident number that means nothing.
    min-characters: ${MIN_POSTING_CHARACTERS:200}
    # Long postings run long at the end (benefits, EEO statements, how to apply), so
    # cutting there keeps the requirements and drops the boilerplate.
    max-characters: ${MAX_POSTING_CHARACTERS:20000}
    # Higher than the resume quota: the natural loop is one resume against many postings.
    max-per-user: ${MAX_POSTINGS_PER_USER:50}
    # A ceiling on advice, not on data. Two hundred "important keywords" is a list
    # nobody can act on, and presenting it as a checklist invites keyword stuffing.
    max-keywords: ${MAX_POSTING_KEYWORDS:25}
  ai:
    # "mock" runs the offline writer: no network, no key, real advice composed from the
    # deterministic findings. It is the default so a fresh clone works, and it is what
    # the test suite uses — a suite that needs a credential is a suite nobody runs.
    provider: ${AI_PROVIDER:mock}
    # Backend-only. This value never reaches the browser, never appears in a response,
    # and is never logged. A blank key means the same as provider=mock.
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.anthropic.com}
    model: ${AI_MODEL:claude-sonnet-4-20250514}
    # A long resume against a long posting is a real amount of reading. Bounded anyway,
    # because this call happens inside a user's request and holds a thread.
    timeout-seconds: ${AI_TIMEOUT_SECONDS:90}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:8000}
    # Transient failures only (429, 5xx, timeout). Small, because somebody is watching a
    # progress screen while this happens.
    max-retries: ${AI_MAX_RETRIES:1}
    # The inputs are capped where they are stored, but a prompt is several of them added
    # together, and the sum is what costs money.
    max-prompt-characters: ${AI_MAX_PROMPT_CHARACTERS:24000}
    # Every score in this product is computed in Java. The model is asked for its own
    # numbers as a second opinion only: the computed one always wins, and a gap wider
    # than this is logged as a signal that the parser or the prompt needs a look.
    score-tolerance: ${AI_SCORE_TOLERANCE:15}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.resumeiq: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
